apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-comparison-demo
  namespace: default
  labels:
    app: rag-comparison-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-comparison-demo
  template:
    metadata:
      labels:
        app: rag-comparison-demo
    spec:
      serviceAccountName: rag-comparison-ksa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: europe-west1-docker.pkg.dev/${GCP_PROJECT}/ai-demo-repo/rag-comparison:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: GCP_PROJECT
              value: "${GCP_PROJECT}"
            - name: GCP_REGION
              value: "europe-west1"
            - name: GEMINI_MODEL
              value: "gemini-3.5-flash"
            - name: GCS_RAG_BUCKET
              value: "${GCS_RAG_BUCKET}"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rag-comparison-svc
  namespace: default
  labels:
    app: rag-comparison-demo
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: rag-comparison-demo
