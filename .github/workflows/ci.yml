name: CI & Build Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Test & Build Go Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Verify formatting
        run: |
          cd src
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formatés :"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          cd src
          go vet ./...

      - name: Run unit tests
        run: |
          cd src
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Build Go binary
        run: |
          cd src
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o rag-chatbot .

  security:
    name: Static Analysis & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      # govulncheck croise les dépendances et la stdlib avec la base de
      # vulnérabilités Go, en ne signalant que les failles réellement atteignables.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd src
          govulncheck ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          cd src
          staticcheck ./...
